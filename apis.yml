name: Kaixin001
description: >-
  Kaixin001 (开心网) is a Chinese social networking website launched in March 2008 by
  founder Cheng Bingao, a former senior executive at Sina. It rose to mass popularity
  in 2009-2010 on the back of viral social games such as "Friends for Sale" and
  "Parking Wars" before losing ground to Renren, Sina Weibo, and WeChat. After the
  parent company was acquired by a listed company in 2016, the founder departed and the
  business pivoted toward enterprise services and internet finance, marginalizing the
  original social network. Kaixin001 discontinued its Flash-based social gaming on
  November 18, 2023, and now persists mainly as a low-activity nostalgia platform. It
  surfaced in the API Evangelist network as a portfolio-lead stub of Qiming and exposes
  no current public developer program, API, or documentation surface.
